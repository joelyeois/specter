# Canonical default config for `specter simulate micrograph`.
# Any field can be overridden on the command line, e.g.:
#   specter simulate micrograph --config configs/micrograph.toml --n_micrographs 10

[potential]
pdb_code = "6bdf"
assembly = true
pdb_savefolder = "specter-data/pdb"  # relative to your working directory (run from the repo root)
n_pixels = 256
pixel_size = 1.0              # Å
micrograph_size = 4096        # pixels, square

# Shtyrov types atoms by their bonded neighbours, and 20 of its 42 species name a
# hydrogen -- which depositions omit. Install the Monomer Library and point
# $CLIBD_MON at it to supply them; without it ~44% of a protein falls back to
# per-element Peng. See docs/installation.md.
#
# The default, "auto", needs no setting: it keeps hydrogens the file already
# carries and adds them only when it has none.
# readd_hydrogens = "auto"    # auto | true | false

[microscope]
voltage = 300.0                # kV
dose = 20.0                    # e⁻/Å²; single value, or [low, high] to sample per micrograph
# n_frames = 20                # frames, uncomment to override default (int(dose) if None)
cs = 2.0                       # mm
alpha = 0.1                    # unitless, amplitude contrast ratio

[envelopes]
# convergence_angle = 1.0       # mrad, uncomment to enable the Cs envelope
# cc = 2.0                      # mm, uncomment to enable the Cc envelope
energy_spread = 0.7            # eV (FWHM)
deltaV_V = 0.06e-6              # unitless (ΔV/V)
deltaI_I = 0.01e-6               # unitless (ΔI/I)
dose_envelope = false

[defocus]
defocus = [5000.0, 15000.0]     # Å; single value, or [low, high] to sample per micrograph

[dataset]
n_micrographs = 1

[models]
scattering_model = "multislice"  # multislice | firstborn | projection | ctf
aberration_model = "holography"  # holography | ctf
noise_model = "poisson"          # poisson | none
coincidence_radius = 0.0         # pixels; 0 = plain Poisson, no coincidence loss; single value, or [low, high]
ice_model = "gd"                 # gd | random | none
ice_thickness = 500.0            # Å, 0 = minimum (particle box size)
# Lateral ice thickness profile. "flat" (the default) is a uniform slab.
# The volume is sized by the THICKEST column and multislice costs one
# full-plane FFT per slice regardless of what it holds, so a profile costs
# what its thickest column costs over the whole field.
ice_profile = "flat"             # flat | wedge | meniscus
# ice_thickness_range = [250.0, 900.0]  # Å, wedge only; overrides ice_thickness
# ice_profile_angle = 0.0        # degrees, wedge ramp direction
# ice_hole_radius = 6000.0       # Å, meniscus only (a 1.2 µm hole)
# ice_rim_thickness = 1500.0     # Å, meniscus thickness at the rim
# ice_hole_offset = [4500.0, 0.0]  # Å, meniscus: hole centre in field coords
# ice_tilt = 0.0                 # Å of z per Å laterally; tilts the slab without changing thickness
# ice_cache_dir = "specter-data/ice"   # defaults to the cache bundled in the package
# crowd_min_distance = 100.0      # Å, uncomment to crowd particles; defaults to pdb.max_diameter
# crowd_max_distance_z = 50.0     # Å
water_air_interface = true
potential_scale = 1.0            # unitless; single value, or [low, high] (values < 1 approximate thicker ice)
pad_fft = false
# specimen_chunk_size = 8                  # uncomment to chunk specimen generation if GPU memory is limited
detector_model = "none"          # none | perfect | k3_300kv | k3_200kv

[postprocessing]
normalize_micrographs = false
save_exitwaves = false
save_clean_exitwaves = false

[compute]
device = "cpu"                   # cpu | cuda | cuda:0

[output]
output_dir = "specter-data/micrographs"
filename = "micrographs"

# Job tracking (opt-in) -- set project or job_id to route output through
# specter.jobs instead of output_dir/filename above: the directory becomes
# job_base_dir/[project/]micrographs/J00N/, numbered, with a job.json
# recording every parameter, the git commit and the run's status. Neither
# is required -- leaving both unset keeps the flat behavior above exactly.
[job]
# project = "my-project"
# job_id = "J001"
# job_base_dir = "specter-data"   # defaults to the project root found by
                                 # walking up from cwd for an existing
                                 # specter-data/, like git finds .git
