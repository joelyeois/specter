# Canonical default config for `specter simulate particles`.
# Any field can be overridden on the command line, e.g.:
#   specter simulate particles --config configs/particle.toml --n_particles 3000

# Full field docs: docs/user-guide/particle-stack.md.

# Where the particles come from. Left unset, the run synthesizes them and
# everything below applies as written; given a file, the poses and
# per-particle CTF come from it instead.
[data]
# cs_path = "path/to/particles.cs"      # a CryoSPARC .cs file
# star_path = "path/to/particles.star"  # ... or a RELION .star file (mutually exclusive)

[specimen]
pdb_source = "6bdf"
assembly = true
n_pixels = 256
pixel_size = 1.0              # Å
ice_thickness = 0.0           # Å, 0 = minimum (particle box size)

[microscope]
voltage = 300.0                # kV
dose = 20.0                    # e⁻/Å²; single value, or [low, high] to sample per particle
cs = 2.0                       # mm
alpha = 0.1                    # unitless, amplitude contrast ratio

[sampling]
defocus = [5000.0, 15000.0]    # Å; single value, or [low, high] to sample per particle
shift = 2.0                    # Å
n_particles = 20

[models]
scattering_model = "multislice"  # multislice | firstborn | projection | ctf
noise_model = "poisson"          # poisson | none
detector_model = "none"          # none | perfect | k3_300kv | k3_200kv

[postprocessing]
normalize_particles = true
save_exitwaves = false
save_clean_exitwaves = false

[compute]
device = "cuda"                  # cpu | cuda | cuda:0 | 0,1,2,3 (multi-GPU)
batchsize = "auto"               # particles per forward pass; "auto" takes the smaller of what
                                 # fits the free memory on `device` and what is worth batching.
                                 # Pin an integer if you set a seed, since batching decides
                                 # which random draw reaches which particle.

[output]
output_dir = "particles"
filename = "particles"

[job]
# project = "my-project"
# job_id = "J001"
# Tracked runs read output_dir above as the ROOT of the numbered tree
# rather than as the folder files land in directly. Leave output_dir
# unset to default that root to the project root found by walking up
# from cwd for an existing .specter marker, like git finds .git.

[advanced]

# --- Structure handling ---
# pdb_cache_dir = "~/.cache/specter/pdb"   # default; set $SPECTER_PDB_CACHE to move it,
# monomer_library_path = "~/monomers" #  point to Monomer library or set at $CLIBD_MON
# The default, "auto", needs no setting: it keeps hydrogens the file already
# carries and adds them only when it has none
# readd_hydrogens = "auto"     # auto | true | false

# --- Potential building ---
scattering_factors = "shtyrov"   # shtyrov | kirkland | lobato
potential_method = "analytic"    # analytic | 2d | 3d -- applies to the structure's own
                                 # potential; ice is built separately
# rcut = 6.0                     # Å, auto-detected per-structure if unset
conv_backend = "fftconvolve"     # unused for potential_method="analytic"
periodic = false                 # wrap atom density across the box faces when voxelizing.
                                 # Keep false for a particle: a protein is a finite object.
                                 # Requires potential_method="3d"; "analytic"/"2d" raise.
# atom_species = ["C.3", "N.ar"]  # per-atom bonded species; auto-detected from PDB bonds if unset
# shtyrov_params_path = "path/to/params.json"  # override the bundled Shtyrov parameter table

# --- Envelopes and dose fractionation ---
# n_frames = 20                # frames, uncomment to override default (int(dose) if None)
# convergence_angle = 1.0      # mrad, uncomment to enable the Cs envelope
# cc = 2.0                     # mm, uncomment to enable the Cc envelope
energy_spread = 0.7            # eV (FWHM)
deltaV_V = 0.06e-6             # unitless (ΔV/V)
deltaI_I = 0.01e-6             # unitless (ΔI/I)
dose_envelope = false
# bfactor = 50.0               # Å², uncomment to enable a B-factor envelope
coincidence_radius = 0.0       # pixels; single value, or [low, high] to sample per particle

# --- Scattering and numerics ---
ews_curvature_sign = "positive"  # negative | positive, matches CryoSPARC's convention
# klim = 0.5                     # 1/Å, reciprocal-space cutoff; unset uses the full Nyquist range
rotate_mode = "real"             # real | fourier
potential_scale = 1.0            # unitless; single value, or [low, high] (< 1 approximates thicker ice)
pad_fft = true

# --- Ice ---
ice_model = "gd"                 # gd | random | none
# ice_cache_dir = "ice"          # defaults to the cache bundled in the package
ice_scattering_factors = "kirkland"  # kirkland | lobato | shtyrov. Deliberately not
                                 # scattering_factors above: ice is a bulk material,
                                 # outside the biomolecular domain Shtyrov is fitted for
ice_relax_steps = 0              # local MLBOP seam-relaxation steps, only used when
                                 # ice_model="gd" tiles multiple cached blocks

# --- Crowding ---
# crowd_min_distance = 100.0      # Å, uncomment to crowd particles; defaults to pdb.max_diameter
# crowd_max_distance_z = 50.0     # Å
# crowd_max_distance_xy = 200.0   # Å
crowd_chunk_size = 1              # duplicate volumes rotated per batch; 1 is both the cheapest
                                  # and the fastest, and peak memory grows linearly with it
crowd_method = "3d"               # 2d | 3d
# crowd_n_points = 50             # cap on the number of crowding duplicates
crowd_seed = "origin"             # origin | random
crowd_move_to_cpu = false
water_air_interface = false

# --- Aberrations (synthetic generation only; a .cs/.star file brings its own) ---
astigmatism = 0.0                # Å, magnitude of dfu - dfv; single value or [low, high]
astigmatism_angle = [0.0, 180.0] # degrees, dfang; irrelevant when astigmatism is 0
phaseshift = 0.0                 # radians
tiltx = 0.0                      # radians
tilty = 0.0                      # radians
trefoil1 = 0.0                   # Å^3, k^3 sin(3θ)
trefoil2 = 0.0                   # Å^3, k^3 cos(3θ)
tetrafoil1 = 0.0                 # Å^4, k^4 cos(2θ)  -- secondary astigmatism
tetrafoil2 = 0.0                 # Å^4, k^4 sin(2θ)  -- secondary astigmatism
tetrafoil3 = 0.0                 # Å^4, k^4 cos(4θ)  -- 4-fold tetrafoil
tetrafoil4 = 0.0                 # Å^4, k^4 sin(4θ)  -- 4-fold tetrafoil

# --- Anisotropic magnification (identity = no correction) ---
anisomag_m00 = 1.0
anisomag_m01 = 0.0
anisomag_m10 = 0.0
anisomag_m11 = 1.0

# --- Reproducibility ---
# seed = 20260731                # RNG seed for pose/CTF/dose sampling; auto-generated and
                                 # logged if unset. Requires an integer `batchsize` above.
