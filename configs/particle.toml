# Canonical default config for `specter simulate particles`.
# Any field can be overridden on the command line, e.g.:
#   specter simulate particles --config configs/particle.toml --n_particles 3000

[potential]
pdb_code = "6bdf"
assembly = true
num_pixels = 256
pixel_size = 1.0              # Å

[microscope]
energy = 300.0                # keV
dose = "20"                    # e⁻/Å²; single value, or "low,high" to sample per particle
cs = 2.0                       # mm
alpha = 0.1                    # unitless, amplitude contrast ratio

[sampling]
defocus = "5000,15000"          # Å; single value, or "low,high" to sample per particle
shift = 2.0                    # Å
n_particles = 20

[models]
scattering_model = "multislice"  # multislice | firstborn | projection | ctf
detector_model = "none"          # none | perfect | k3_300kv | k3_200kv

[postprocessing]
normalize_particles = true
save_exitwaves = false
save_clean_exitwaves = false

[compute]
device = "cpu"                   # cpu | cuda | cuda:0 | 0,1,2,3 (multi-GPU)
batchsize = 5

[output]
output_dir = "./output/"
filename = "particles"

# --- Advanced: rarely touched, but available for tweaking ---
[advanced]
pdb_savefolder = "pdb-data"  # resolved relative to the repo root
# cs_path = "path/to/particles.cs"  # uncomment to drive generation from a CryoSPARC .cs file
# num_frames = 20                # frames, uncomment to override default (int(dose) if None)
# convergence_angle = 1.0       # mrad, uncomment to enable the Cs envelope
# cc = 2.0                      # mm, uncomment to enable the Cc envelope
energy_spread = 0.7            # eV (FWHM)
deltaV_V = 0.06e-6              # unitless (ΔV/V)
deltaI_I = 0.01e-6               # unitless (ΔI/I)
dose_envelope = false
# bfactor = 50.0                # Å², uncomment to enable a B-factor envelope
aberration_model = "holography"  # holography | ctf
noise_model = "poisson"          # poisson | none
coincidence_radius = "0"         # pixels; single value, or "low,high" to sample per particle
ice_model = "gd"                 # gd | random | none
ice_thickness = 0.0              # Å, 0 = minimum (particle box size)
# ice_cache_dir = "ice-data/ice_cache"  # defaults to the bundled cache
# crowd_min_distance = 100.0      # Å, uncomment to crowd particles; defaults to pdb.max_diameter
# crowd_max_distance_z = 50.0     # Å
potential_scale = "1"            # unitless; single value, or "low,high" (values < 1 approximate thicker ice)
pad_fft = true
