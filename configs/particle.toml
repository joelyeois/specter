# Canonical default config for `specter simulate particles`.
# Any field can be overridden on the command line, e.g.:
#   specter simulate particles --config configs/particle.toml --n_particles 3000

[potential]
pdb_source = "6bdf"
assembly = true
n_pixels = 256
pixel_size = 1.0              # Å

[microscope]
voltage = 300.0                # kV
dose = 20.0                    # e⁻/Å²; single value, or [low, high] to sample per particle
cs = 2.0                       # mm
alpha = 0.1                    # unitless, amplitude contrast ratio

[sampling]
defocus = [5000.0, 15000.0]     # Å; single value, or [low, high] to sample per particle
shift = 2.0                    # Å
n_particles = 20

[models]
scattering_model = "multislice"  # multislice | firstborn | projection | ctf
detector_model = "none"          # none | perfect | k3_300kv | k3_200kv

[postprocessing]
normalize_particles = true
save_exitwaves = false
save_clean_exitwaves = false

[compute]
device = "cpu"                   # cpu | cuda | cuda:0 | 0,1,2,3 (multi-GPU)
batchsize = "auto"               # particles per forward pass. "auto" takes the smaller of what
                                 # fits in the free memory on `device` and what is worth
                                 # batching: past the point where one forward pass already
                                 # saturates the device, a bigger batch costs memory without
                                 # going faster. At the 256 box above it resolves to 1, which
                                 # measured as fast as any larger batch and 21x leaner; a
                                 # smaller box batches up and does get faster.
                                 # Pin an integer if you set a seed, since batching decides
                                 # which random draw reaches which particle (a seeded run
                                 # rejects "auto").

[output]
output_dir = "particles"
filename = "particles"

# Job tracking (opt-in) -- set project or job_id to route output through
# specter.jobs instead of output_dir/filename above: the directory becomes
# output_dir/[project/]particles/J00N/, numbered, with a job.json
# recording every parameter, the git commit and the run's status. Neither
# is required -- leaving both unset keeps the flat behavior above exactly.
[job]
# project = "my-project"
# job_id = "J001"
# Tracked runs read output_dir above as the ROOT of the numbered tree
# rather than as the folder files land in directly. Leave output_dir
# unset to default that root to the project root found by walking up
# from cwd for an existing .specter marker, like git finds .git.

# --- Advanced: rarely touched, but available for tweaking ---
[advanced]
# pdb_cache_dir = "~/.cache/specter/pdb"   # default; set $SPECTER_PDB_CACHE to move it,
                                           # e.g. onto scratch. Downloads only --
                                           # your own files are read where they are.
# cs_path = "path/to/particles.cs"  # uncomment to drive generation from a CryoSPARC .cs file
# star_path = "path/to/particles.star"  # ... or from a RELION .star file (mutually exclusive with cs_path)
# n_frames = 20                # frames, uncomment to override default (int(dose) if None)
# convergence_angle = 1.0       # mrad, uncomment to enable the Cs envelope
# cc = 2.0                      # mm, uncomment to enable the Cc envelope
energy_spread = 0.7            # eV (FWHM)
deltaV_V = 0.06e-6              # unitless (ΔV/V)
deltaI_I = 0.01e-6               # unitless (ΔI/I)
dose_envelope = false
# bfactor = 50.0                # Å², uncomment to enable a B-factor envelope
noise_model = "poisson"          # poisson | none
coincidence_radius = 0.0         # pixels; single value, or [low, high] to sample per particle
ice_model = "gd"                 # gd | random | none
ice_thickness = 0.0              # Å, 0 = minimum (particle box size)
# ice_cache_dir = "ice"   # defaults to the cache bundled in the package
# crowd_min_distance = 100.0      # Å, uncomment to crowd particles; defaults to pdb.max_diameter
# crowd_max_distance_z = 50.0     # Å
potential_scale = 1.0            # unitless; single value, or [low, high] (values < 1 approximate thicker ice)
pad_fft = true

# potential building
potential_parameterization = "shtyrov"   # shtyrov | kirkland | lobato
potential_method = "analytic"            # analytic | 2d | 3d -- applies to the
                                 # structure's own potential; ice is built separately
# rcut = 6.0                     # Å, auto-detected per-structure if unset
conv_backend = "fftconvolve"     # unused for potential_method="analytic"
periodic = false                 # wrap atom density across the box faces when voxelizing. Keep
                                 # false for a particle: a protein is a finite object, so wrapping
                                 # would smear its edge density onto the opposite face. Only for
                                 # coordinates that really are periodic, fed through PotentialBuilder
                                 # yourself -- the built-in ice path does its own wrapping and never
                                 # uses this. Requires potential_method="3d"; "analytic"/"2d" raise.
# atom_species = ["C.3", "N.ar"]  # per-atom bonded species; auto-detected from PDB bonds if unset
# shtyrov_params_path = "path/to/params.json"  # override the bundled Shtyrov parameter table

# Shtyrov types atoms by their bonded neighbours, and 20 of its 42 species name a
# hydrogen -- which depositions omit. Install the Monomer Library and point
# $CLIBD_MON at it to supply them; without it ~44% of a protein falls back to
# per-element Peng. See docs/installation.md.
#
# The default, "auto", needs no setting: it keeps hydrogens the file already
# carries and adds them only when it has none. Set it only to override that --
# true always re-adds from ideal geometry, false adds no hydrogen density
# (hydrogens still inform atom typing either way).
# readd_hydrogens = "auto"       # auto | true | false

# scattering
ews_curvature_sign = "positive"  # negative | positive, matches CryoSPARC's convention
# klim = 0.5                     # 1/Å, reciprocal-space cutoff; unset uses the full Nyquist range
rotate_mode = "real"             # real | fourier

# ice
# ice_parameterization = "shtyrov"  # kirkland | lobato | shtyrov; unset, the ice
                                 # follows potential_parameterization above, so the
                                 # structure and the ice around it are modelled the
                                 # same way. Set it only to deliberately differ.
ice_relax_steps = 0               # local MLBOP seam-relaxation steps, only used when ice_model="gd" tiles multiple cached blocks

# crowding
crowd_chunk_size = 1              # crowding volumes rotated per GPU batch; raise for speed if you have RAM to spare
# crowd_max_distance_xy = 200.0   # Å
crowd_method = "3d"               # 2d | 3d
# crowd_n_points = 50             # cap on the number of crowding duplicates
crowd_seed = "origin"             # origin | random
crowd_move_to_cpu = false
water_air_interface = false

# reproducibility
# seed = 20260731                # RNG seed for pose/CTF/dose sampling; auto-generated and logged if
                                 # unset. Requires an integer `batchsize` above, not "auto".

# aberration richness for synthetic (non-.cs-driven) generation
astigmatism = 0.0                # Å, magnitude of dfu - dfv; single value or [low, high]
astigmatism_angle = [0.0, 180.0] # degrees, dfang; irrelevant when astigmatism is 0
phaseshift = 0.0                 # radians
tiltx = 0.0                      # radians
tilty = 0.0                      # radians
trefoil1 = 0.0                   # Å^3, k^3 sin(3θ)
trefoil2 = 0.0                   # Å^3, k^3 cos(3θ)
tetrafoil1 = 0.0                 # Å^4, k^4 cos(2θ)  -- secondary astigmatism
tetrafoil2 = 0.0                 # Å^4, k^4 sin(2θ)  -- secondary astigmatism
tetrafoil3 = 0.0                 # Å^4, k^4 cos(4θ)  -- 4-fold tetrafoil
tetrafoil4 = 0.0                 # Å^4, k^4 sin(4θ)  -- 4-fold tetrafoil

# anisotropic magnification -- identity (no correction) by default
anisomag_m00 = 1.0
anisomag_m01 = 0.0
anisomag_m10 = 0.0
anisomag_m11 = 1.0
