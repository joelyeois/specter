# Canonical default config for `specter simulate tiltseries` and the
# create_tilt_series demo notebooks, loaded via
# specter.config.load_config("...", TiltSeriesConfig).
#
# This is the IMAGING half of the two-stage cryo-ET pipeline only:
#   1. `specter build tomogram` (configs/tomogram.toml) builds a specimen
#      volume and writes it to disk as a .mrc file.
#   2. This config loads that volume (volume_path) and simulates the
#      tilted acquisition (multislice scattering, CTF, dose, detector,
#      noise, ice).
#
# volume_path is left unset here since it's normally set programmatically
# (pointing at whatever `specter build tomogram` just wrote) rather than
# hardcoded in this file -- e.g.:
#   specter simulate tiltseries --volume_path output/tomogram.mrc

[specimen]
# volume_path = "path/to/specimen.mrc"   # uncomment to hardcode instead
target_v_size = 2.0                # Å/voxel -- MUST match whatever built
                                    # the volume (configs/tomogram.toml's
                                    # own v_size, by default)

[microscope]
# micrograph_size = 3000            # pixels, square; defaults (commented
                                     # out) to the loaded volume's own XY
                                     # extent
voltage = 300.0                     # kV
dose_per_tilt = 3.0                # e⁻/Å², per tilt angle
num_frames = 10                    # movie frames per tilt
cs = 2.0                           # mm
alpha = 0.1                        # unitless, amplitude contrast ratio

[envelopes]
# convergence_angle = 1.0          # mrad, uncomment to enable the Cs envelope
# cc = 2.0                         # mm, uncomment to enable the Cc envelope
energy_spread = 0.7                # eV (FWHM)
deltaV_V = 0.06e-6                 # unitless (ΔV/V)
deltaI_I = 0.01e-6                 # unitless (ΔI/I)
dose_envelope = false

[defocus]
defocus = 22000.0                  # Å (positive = underfocus)

[tilt_geometry]
min_tilt_angle = -45.0             # degrees
max_tilt_angle = 45.0              # degrees
n_tilts = 61
tilt_axis = "y"                    # x | y

[models]
scattering_model = "multislice"    # multislice | firstborn | projection | ctf
aberration_model = "holography"    # holography | ctf
noise_model = "poisson"            # poisson | none
coincidence_radius = 0.5984        # pixels (effective exclusion radius)
ice_model = "gd"                   # gd | random | none
# ice_cache_dir = "ice-data/ice_cache"  # defaults to the bundled cache
ice_relax_steps = 0                # local MLBOP seam-relaxation steps for ice_model="gd"
pad_fft = false
detector_model = "none"            # none | perfect | k3_300kv | k3_200kv

[postprocessing]
normalize_tilt_series = false
save_exitwaves = false

[compute]
device = "cpu"                     # cpu | cuda | cuda:0

[output]
output_dir = "specter-data/tiltseries"
filename = "tilt_series"
