# Canonical default config for `specter simulate tiltseries`.
# Any field can be overridden on the command line, e.g.:
#   specter simulate tiltseries --config configs/tiltseries.toml --n_tilts 41

# Full field docs: docs/user-guide/tilt-series.md.

# This is the IMAGING half of the two-stage cryo-ET pipeline: `specter build
# tomogram` (configs/tomogram.toml) writes a specimen volume, and this config
# loads it (volume_path) and simulates the tilted acquisition. volume_path is
# left unset since it normally points at whatever the build step just wrote:
#   specter simulate tiltseries --volume_path tomograms/tomogram.mrc

[specimen]
# volume_path = "path/to/specimen.mrc"   # uncomment to hardcode instead
voxel_size = 5.0                   # Å/voxel -- MUST match whatever built the volume
                                   # (configs/tomogram.toml's own voxel_size, by default)

[microscope]
voltage = 300.0                    # kV
dose_per_tilt = 3.0                # e⁻/Å², per tilt angle
n_frames = 10                      # movie frames per tilt
cs = 2.0                           # mm
alpha = 0.1                        # unitless, amplitude contrast ratio

[defocus]
defocus = 22000.0                  # Å (positive = underfocus)

[tilt_geometry]
min_tilt_angle = -45.0             # degrees
max_tilt_angle = 45.0              # degrees
n_tilts = 61
tilt_axis = "y"                    # x | y

[absorption]
absorption_model = "alpha"         # alpha | inelastic_mfp -- inelastic_mfp derives the
                                   # imaginary potential per material and sets alpha to 0
# inelastic_mfp_solvent = 3950.0   # Å; unset = measured ice value at the run's voltage
# inelastic_mfp_specimen = 2460.0  # Å; unset = the ice's value (no absorption contrast)
# objective_aperture = 12.0        # mrad, inelastic_mfp only (70 µm on a Krios)

[models]
scattering_model = "multislice"    # multislice | firstborn | projection | ctf
noise_model = "poisson"            # poisson | none
detector_model = "none"            # none | perfect | k3_300kv | k3_200kv | k2_300kv | falcon4i_300kv | falcon4i_200kv | falcon3ec_300kv

[postprocessing]
normalize_tilt_series = false
save_exitwaves = false

[compute]
device = "cuda"                    # cpu | cuda | cuda:0 -- "cuda" falls back to the CPU with
                                   # a warning when none is available; "cuda:0" does not

[output]
output_dir = "tiltseries"
filename = "tilt_series"

[job]
# project = "my-project"
# job_id = "J001"
# Tracked runs read output_dir above as the ROOT of the numbered tree
# rather than as the folder files land in directly. Leave output_dir
# unset to default that root to the project root found by walking up
# from cwd for an existing .specter marker, like git finds .git.

[advanced]

# --- Field of view ---
# micrograph_size = 3000         # pixels, square; defaults to the loaded volume's XY extent

# --- Envelopes and dose fractionation ---
# convergence_angle = 1.0        # mrad, uncomment to enable the Cs envelope
# cc = 2.0                       # mm, uncomment to enable the Cc envelope
energy_spread = 0.7                # eV (FWHM)
deltaV_V = 0.06e-6                 # unitless (ΔV/V)
deltaI_I = 0.01e-6                 # unitless (ΔI/I)
dose_envelope = false
# dose_envelope_target = "specimen"  # damage each tilt's specimen, not the ice
# bfactor = 50.0               # Å², uncomment to enable a B-factor envelope
coincidence_radius = 0.0           # pixels; 0 = plain Poisson, no coincidence loss

# --- Ice ---
ice_model = "gd"                   # gd | random | none
# ice_cache_dir = "ice"            # defaults to the cache bundled in the package
ice_relax_steps = 0                # local MLBOP seam-relaxation steps, ice_model="gd" only
# ice_motion_variance = 0.38       # Å² per e⁻/Å²; filtered at each tilt's own dose
bulk_scattering_factors = "kirkland"  # kirkland | lobato | shtyrov; the ice and any
                                   # other non-biomolecular material

# --- Numerics ---
# klim = 0.66                   # fraction of Nyquist, Kirkland's anti-aliasing bandlimit;
                                 # unset keeps the full Nyquist range
pad_fft = false

# --- Reproducibility ---
# seed = 0                       # RNG seed; auto-generated and logged if unset
