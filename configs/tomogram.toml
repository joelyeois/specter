# Canonical default config for `specter build tomogram`, loaded via
# specter.config.load_config("...", TomogramConfig).
#
# Drives SpherePackingSpecimenGenerator: packs several PDB-derived protein
# species -- each at its own real physical size -- via hard-sphere packing
# (specter.specimen.packing.pack_hard_spheres_3d), renders each placed
# instance's real scattering potential, and saves the assembled volume as
# .mrc (directly usable as `specter simulate tiltseries`'s --volume_path)
# plus one copick-style .ndjson pick file per species.
#
# Species are packed in two priority stages:

# [targets] -- placed FIRST, each at an exact "n_copies" count. These are
# the annotated ground truth, always exported to picks.
[targets]
targets = [
    { pdb_source = "1bxn", n_copies = 20 },  # cytosolic RNA polymerase II complex (large)
    { pdb_source = "6qzp", n_copies = 10 },
]

# [filler] -- placed SECOND, around the already-placed targets, drawn with
# equal attempt-weight across species and budgeted by
# filler_occupancy_fraction below.
[filler]
filler = [
    { pdb_source = "1fa2" },  # beta amylase (medium)
    { pdb_source = "1mbo" },  # myoglobin (small)
]

# Optional, additive to [filler] above: pull extra filler species from the
# bundled reference tables instead of (or alongside) hand-listing codes.
# filler_from_pei2016 = true         # Pei et al. 2016 generic crowding table
# filler_from_cryoetsim = true       # Stojanovska et al. 2025 CryoETSim table
# filler_table_categories = ["distractors", "nucleosomes"]  # cryoetsim only;
#                                     # omit for all 4 usable categories
# filler_table_max_mw_kda = 300.0    # applied to whichever table(s) above
# filler_table_min_mw_kda = 20.0     # are enabled

# --- Organic membrane mode (mutually exclusive with [targets]/[filler] above) ---
# Uncomment the whole block below (and comment out/empty [targets]/[filler])
# to build one or more organic membranes + region-gated cytosol/lumen protein
# packing instead of hard-sphere packing. shape_backend is one of
# "spherical_harmonics" (default), "swept_spline" -- the two supported
# backends -- or "metaball"/"alpha_shape", both DEPRECATED (kept for backward
# compatibility only, emit a DeprecationWarning). See
# specter.specimen.membrane.MembraneGenerator's own docstring for each
# backend's full parameter set. Each [[membrane]] entry is a TEMPLATE, not
# necessarily one instance: size (sh_axes_a/swept_tube_radius_a/etc.),
# position_xyz, and target_shape_zyx all default to auto (realistic random
# size, collision-rejecting random placement, auto-sized local working grid
# respectively) if omitted -- see MembraneGenerator's/MembraneTomogramGenerator's
# own docstrings. n_instances (default 1) expands one entry into that many
# independent, independently-seeded, independently-placed instances sharing
# the rest of that entry's kwargs.
# [[membrane]]
# shape_backend = "spherical_harmonics"
# n_instances = 3
# bilayer_thickness_a = 30.0
#
# [[membrane]]
# shape_backend = "swept_spline"
# bilayer_thickness_a = 30.0
# position_xyz = [400.0, 0.0, 0.0]   # explicit placement instead (n_instances must stay 1)
#
# [[membrane_transmembrane_specs]]
# pdb_source = "6qzp"
# frequency = 1
#
# [[membrane_protein_specs]]
# pdb_source = "1mbo"
# location = "lumen"
#
# [[membrane_protein_specs]]
# pdb_source = "1bxn"
# location = "cytosol"
#
# membrane_occupancy_fraction = 0.2   # bare-sphere fraction of EACH REGION's
#                                     # own volume (not the whole box)
# membrane_parameterization = "shtyrov"  # cytosol/lumen protein potential step
# write_segmentation = true          # {filename}_protein_labels.mrc always;
#                                     # membrane mode also gets
#                                     # {filename}_membrane_labels.mrc (which
#                                     # instance) and {filename}_regions.mrc
#                                     # (0=cytosol/1=shell/2=lumen)

[specimen]
target_shape = [128, 512, 512]    # (Z, Y, X) voxels
v_size = 5.0                       # Å/voxel
filler_occupancy_fraction = 0.5    # bare-sphere volume fraction budget for
                                    # filler -- deliberately high so it packs
                                    # until it jams rather than needing to be
                                    # precisely calibrated (see TOMOGRAM_HELP)
gap_angstrom = 5.0                 # minimum clearance between placed spheres
packing_method = "rsa"             # rsa | dense -- filler-stage backend;
                                    # dense has no obstacle avoidance, so it
                                    # only works when targets is empty
pdb_savefolder = "pdb-data"        # resolved relative to the repo root
# seed = 11                        # uncomment for reproducible packing
clip_axes = [false, true, true]  # (z, y, x) -- True lets placed instances
                                    # poke past that wall instead of being
                                    # rejected, e.g. for a tomogram whose xy
                                    # field of view is a crop of a larger
                                    # cellular region

[picks]
write_picks = true
annotation_version = "1.0"

[compute]
device = "cuda"                     # cpu | cuda | cuda:0. Non-membrane mode
                                    # (targets/filler): used ONLY for
                                    # PotentialBuilder's potential-building
                                    # step; packing always runs on CPU
                                    # regardless (vesin's neighbor list is
                                    # slower and OOM-prone on GPU). Membrane
                                    # mode ([[membrane]] present): drives the
                                    # entire MembraneGenerator/
                                    # MembraneTomogramGenerator pipeline for
                                    # every instance (shape field, bilayer
                                    # profile, rasterization, transmembrane
                                    # protein rendering).

[output]
output_dir = "./output/"
filename = "tomogram"
