# Canonical default config for `specter build tomogram`.
# Full field docs: docs/user-guide/build-tomogram.md
# (or run `specter build tomogram --help`).
#
# Every flag on the CLI overrides the matching field below.


# =============================================================================
# GEOMETRY & PACKING
# =============================================================================

[specimen]
target_shape = [300, 1200, 1200]    # (Z, Y, X) voxels
voxel_size = 5.0                        # A/voxel
clip_axes = [true, true, true]      # (z, y, x) -- True lets instances poke past that wall
filler_occupancy_fraction = 1.0
# packing_backend = "shape"      # default; "sphere" is faster but ~3x less dense
# packing_voxel_size = 2.0       # collide on a coarser grid than the render
# There is no `gap`: macromolecules in crowded cytoplasm contact each other,
# so placed instances are only required not to overlap.
# pdb_cache_dir = "~/.cache/specter/pdb"   # default; set $SPECTER_PDB_CACHE to move it,
                                           # e.g. onto scratch. Downloads only --
                                           # your own files are read where they are.
# seed = 11                         # uncomment for reproducible packing


# =============================================================================
# OUTPUT
# =============================================================================

[output]
output_dir = "tomograms"
filename = "tomogram"

# Job tracking (opt-in) -- set project or job_id to route output through
# specter.jobs instead of output_dir/filename above: the directory becomes
# output_dir/[project/]tomograms/J00N/, numbered, with a job.json
# recording every parameter, the git commit and the run's status. Neither
# is required -- leaving both unset keeps the flat behavior above exactly.
# When chained via --tomogram_config on `specter simulate tiltseries`,
# leaving this unset while tracking the tiltseries run cascades that
# project here automatically -- two separate, linked jobs from one call.
[job]
# project = "my-project"
# job_id = "J001"
# Tracked runs read output_dir above as the ROOT of the numbered tree
# rather than as the folder files land in directly. Leave output_dir
# unset to default that root to the project root found by walking up
# from cwd for an existing .specter marker, like git finds .git.

[picks]
write_picks = true
annotation_version = "1.0"
write_segmentation = true


# =============================================================================
# COMPUTE
# =============================================================================

[compute]
device = "cuda"                     # cpu | cuda | cuda:0 | 0,1,2
accumulator_device = "auto"
render_workers = "auto"
render_chunk_size = 64


# =============================================================================
# CONTENTS -- TARGET SPECIES
# Exact-count, placed first, written to picks as ground truth.
# =============================================================================

[targets]
targets = [
    { pdb_source = "7VD8", n_copies = 15 },  # apoferritin
    { pdb_source = "1FA2", n_copies = 15 },  # beta-amylase
    { pdb_source = "6DRV", n_copies = 15 },  # beta-galactosidase
    { pdb_source = "6QZP", n_copies = 15 },  # ribosome
    { pdb_source = "7B75", n_copies = 15 },  # thyroglobulin
    { pdb_source = "6N4V", n_copies = 15 },  # virus-like particle
]


# =============================================================================
# CONTENTS -- FILLER SPECIES
# Ratio-weighted background crowding, placed after targets, around them.
# Hand-listed species and the bundled reference tables are additive.
# =============================================================================

[filler]
filler = [
    { pdb_source = "1fa2", location = "lumen" },  # beta amylase, as an example lumen filler
]

filler_from_pei2016 = true
# filler_from_cryoetsim = true       # Stojanovska et al. 2025 CryoETSim table
# filler_table_categories = ["distractors", "nucleosomes"]  # cryoetsim only
# filler_table_max_mw_kda = 300.0
# Raising the mass floor lifts achieved occupancy: tiny species consume the
# placement slots RSA jams on while adding little volume.
# filler_table_min_mw_kda = 20.0

# Atomic scattering-factor parameterization for the targets/filler protein-fill
# step specifically (applies regardless of whether any [[membrane]] is set).
target_parameterization = "shtyrov"

# Shtyrov types atoms by their bonded neighbours, and 20 of its 42 species name a
# hydrogen -- which depositions omit. Install the Monomer Library and point
# $CLIBD_MON at it to supply them; without it ~44% of a protein falls back to
# per-element Peng. See docs/installation.md.
#
# The variable is not the only way in: set monomer_library_path below to record
# the library in this config instead. Prefer that when a run has to be
# reproducible from its config alone -- unlike pdb_cache_dir, this choice
# changes the rendered potential, so a config omitting it does not fully
# describe what it produced. Unset, $CLIBD_MON still applies.
# monomer_library_path = "~/monomers"
#
# The default, "auto", needs no setting: it keeps hydrogens the file already
# carries and adds them only when it has none.
# readd_hydrogens = "auto"     # auto | true | false


# =============================================================================
# CONTENTS -- MEMBRANES
# One [[membrane]] table per population. Omit them all for a membrane-free
# volume; the whole box is then one cytosol region.
# =============================================================================

[[membrane]]
shape_backend = "spherical_harmonics"
bilayer_thickness = 30.0
sh_axes_range = [150.0, 1600.0]   # SEMI-axes, A -- a vesicle's diameter is
                                    # roughly twice these.
n_copies = 3

[[membrane]]
shape_backend = "swept_spline"
bilayer_thickness = 30.0
swept_total_length_range = [1500.0, 2400.0] # path contour length, A
swept_tube_radius_range = [150.0, 400.0] # tube radius, A
n_copies = 3

# Proteins embedded in the bilayer, one table per species.
[[membrane_transmembrane_specs]]
pdb_source = "1C3W"  # bacteriorhodopsin
n_copies = 40        # per membrane instance; a request, not a guarantee

[membrane_settings]
# membrane_region_density_threshold = 0.05
membrane_min_transmembrane_spacing = 40.0


# =============================================================================
# CONTENTS -- FILAMENTS, MICROTUBULES, CARBON FILM, GOLD FIDUCIALS
# All are ON here, since a real tomogram usually has all of them.
# Delete or comment out a block to leave that feature out.
# =============================================================================

# Filaments. Either hand-write [[filaments]] entries (FilamentSpec kwargs), as
# below, or set `actin = true` for the built-in ACTIN_SPEC preset.
[[filaments]]
code = "1J6Z"          # F-actin monomer
step = 27.3            # axial rise per monomer, A
flex_deg = 12.0        # max per-step path curvature, degrees
twist_deg = 166.15     # helical twist per monomer, degrees
n_copies = 20
n_monomers = [20, 60]

# Microtubules. Real 13-protofilament tubes (lumen, A-lattice seam, tubulin
# dimer wall) -- NOT a [[filaments]] entry, which would give a single
# protofilament. `code` defaults to a dimer extracted from a deposited
# microtubule reconstruction, fetched and cached on first use; `length`
# defaults to the volume diagonal so a microtubule crosses the field.
[[microtubules]]
n_copies = 2
n_protofilaments = 13   # 13 is the canonical in-cell lattice
# length = 6000.0       # A; omit to span the volume diagonal
# bend_radius = 30000.0 # A; omit for a straight, thermally bent tube

# Carbon support film -- at most one [[carbon_film]] table. With hole_radius set to
# roughly the box width, only a sliver of film intrudes at one edge, which is
# what a tomogram near a hole edge actually looks like. Costs ~9 s at the box
# size above.
[[carbon_film]]
hole_radius = 6000.0          # A (0.6 micron, Quantifoil R1.2/1.3)
edge_fraction = [0.02, 0.05]
edge_side = "random"          # "left" | "right" | "top" | "bottom" | "random"

# Gold fiducial beads -- one [[beads]] table per population. `radius` takes a
# single number or a [low, high] pair drawn per bead; real colloidal gold is
# not monodisperse, so a range is the more faithful default.
[[beads]]
radius = [80.0, 120.0]        # A -- i.e. 16-24 nm diameter
n_copies = 20

[bead_settings]
# How irregular each fiducial's boundary is, as an RMS fraction of its radius.
# One number, or a [low, high] pair drawn per bead so the population mixes
# near-round and misshapen particles. 0.0 gives clean spheres.
bead_roughness = [0.0, 0.2]
