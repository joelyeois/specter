[potential]
pdb_source = "6bdf"
assembly = true
n_pixels = 256
pixel_size = 0.83       # Å
micrograph_size = 2048  # pixels, square

[microscope]
voltage = 300.0     # kV
dose = 20.0         # e⁻/Å², used as a fixed dose (this notebook doesn't randomize per micrograph)
n_frames = 50      # frames, usually ~1-2 e⁻/Å²/frame
cs = 2.0               # mm
alpha = 0.1              # unitless, amplitude contrast ratio

[defocus]
defocus = [5000.0, 15000.0]    # Å

[dataset]
n_micrographs = 1

[models]
scattering_model = "multislice"
noise_model = "poisson"
ice_model = "gd"              # tiled from a pre-baked cache: scales to large micrographs at
                               # near-constant memory (unlike "random", which builds one
                               # single ice cube the full size of the micrograph -- fine for
                               # small particle boxes, but memory-heavy at this notebook's
                               # 2048x2048 micrograph_size). "random" is fast/cheap and still a
                               # good choice for smaller micrographs.
detector_model = "none"
coincidence_radius = 1.8      # pixels
specimen_chunk_size = 8                # slice chunk size for specimen generation; lower if GPU memory is limited

[ice]
ice_thickness = 500.0    # Å
# Lateral thickness profile. "flat" (the default) is the uniform slab this
# notebook has always simulated. Uncomment the two lines below for a wedge:
# the box is then sized by the thickest column, so a 250-900 Å ramp costs
# what a uniform 900 Å slab costs over the whole field.
ice_profile = "flat"     # flat | wedge | meniscus
# ice_thickness_range = [250.0, 900.0]   # Å, wedge only; overrides ice_thickness
# ice_profile_angle = 0.0                # degrees, ramp direction
# ice_cache_dir = "../../ice-data/ice_cache"  # defaults to the bundled cache

[compute]
device = "cuda:0"  # adjust to an available device on your machine, e.g. "cuda:0" or "cpu"
