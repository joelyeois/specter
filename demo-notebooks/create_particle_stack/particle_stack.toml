[potential]
pdb_code = "6bdf"
assembly = true
num_pixels = 256
pixel_size = 1.0     # Å

[microscope]
voltage = 300.0       # kV
dose = "20"          # e⁻/Å², used as a fixed dose (this notebook doesn't randomize per particle)
cs = 2.0             # mm
alpha = 0.1          # unitless, amplitude contrast ratio

[envelopes]
bfactor = 0.0        # Å²

[sampling]
defocus = "5000,15000"   # Å; single value, or "low,high" to sample per particle
shift = 2.0  # Å

[dataset]
n_particles = 20

[models]
scattering_model = "multislice"
aberration_model = "holography"
noise_model = "poisson"
ice_model = "gd"
detector_model = "none"
coincidence_radius = "1.8"  # pixels

[ice]
ice_thickness = 0.0       # Å
# ice_cache_dir = "../../ice-data/ice_cache"  # defaults to the bundled cache

[compute]
device = "cuda:1"  # adjust to an available device on your machine, e.g. "cuda:0" or "cpu"
batchsize = 5      # reduce if out of memory.
