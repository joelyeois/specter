[potential]
pdb_source = "6bdf"
assembly = true
n_pixels = 256
pixel_size = 1.0     # Å

[microscope]
voltage = 300.0       # kV
dose = 20.0          # e⁻/Å²
cs = 2.0             # mm
alpha = 0.1          # unitless, amplitude contrast ratio

[envelopes]
bfactor = 0.0        # Å²

[sampling]
defocus = [5000.0, 15000.0]   # Å; single value, or [low, high] to sample per particle
shift = 2.0  # Å

[dataset]
n_particles = 4

[models]
scattering_model = "multislice"
noise_model = "poisson"
ice_model = "gd"
detector_model = "none"
coincidence_radius = 0.0  # pixels

[ice]
ice_thickness = 0.0       # Å
# ice_cache_dir = "../../ice-data/ice_cache"  # defaults to the bundled cache

[crowding]
# crowd_min_distance = 150.0  # Å; None below means "use the structure's own max diameter"

[fft]
pad_fft = true

[compute]
device = "cuda:0"  # adjust to an available device on your machine, e.g. "cuda:0" or "cpu"
