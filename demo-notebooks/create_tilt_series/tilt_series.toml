# Imaging half of the two-stage cryo-ET pipeline this notebook walks
# through: tomogram.toml (this folder) builds the specimen volume, this
# file simulates the tilted acquisition from it. voxel_size below MUST
# match tomogram.toml's own voxel_size.

[specimen]
voxel_size = 5.0   # Å/voxel -- must match tomogram.toml's voxel_size

[microscope]
voltage = 300.0
dose_per_tilt = 3.0
n_frames = 10
cs = 2.0
alpha = 0.1

[defocus]
defocus = 22000.0

[tilt_geometry]
min_tilt_angle = -45.0
max_tilt_angle = 45.0
n_tilts = 5              # quick smoke test; use ~41-61 for a real tilt scheme
tilt_axis = "y"

[models]
scattering_model = "multislice"
aberration_model = "holography"
noise_model = "poisson"
ice_model = "gd"          # bundled IceBank cache; try "random" for a faster/cheaper placeholder
ice_relax_steps = 0
detector_model = "none"
coincidence_radius = 0
pad_fft = true  # fixes multislice edge-wraparound artifacts at this wide tilt range

[compute]
device = "cuda:0"  # adjust to an available device on your machine, e.g. "cuda:0" or "cpu"

[output]
output_dir = "tiltseries"
filename = "tilt_series"
