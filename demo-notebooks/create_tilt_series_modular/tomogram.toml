# Specimen config for this notebook -- same composition/style as the canonical
# configs/tomogram.toml, just a smaller box for a quick demo. Loaded below via
# load_config("tomogram.toml", TomogramConfig). Full field docs:
# docs/user-guide/build-tomogram.md (or `specter build tomogram --help`).
# The notebook itself only syncs tilt_series_generator_modular.toml's
# voxel_size to this file's own voxel_size below -- everything else about the
# specimen is edited here, not in the notebook.
#
# The tables below appear in the same order as the panels in
# `specter build tomogram --help`, ending with [advanced]; the specimen's
# contents ([[membrane]], [[filaments]], ...) have no command-line spelling
# and sit where their generation stage runs.


[specimen]
target_shape = [128, 256, 256]      # (Z, Y, X) voxels -- small/fast; raise for denser results
voxel_size = 10.0                        # A/voxel -- notebook syncs tilt_series_generator_modular.toml's voxel_size to this
clip_axes = [true, true, true]      # (z, y, x) -- True lets instances poke past that wall
filler_occupancy_fraction = 1.0
# There is no `gap`: macromolecules in crowded cytoplasm contact each other,
# so placed instances are only required not to overlap.

[targets]
targets = [
    { pdb_source = "7VD8", n_copies = 15 },  # apoferritin
    { pdb_source = "1FA2", n_copies = 15 },  # beta-amylase
    { pdb_source = "6DRV", n_copies = 15 },  # beta-galactosidase
    { pdb_source = "6QZP", n_copies = 15 },  # ribosome
    { pdb_source = "7B75", n_copies = 15 },  # thyroglobulin
    { pdb_source = "6N4V", n_copies = 15 },  # virus-like particle
]

[filler]
filler = [
    { pdb_source = "1fa2", location = "lumen" },  # beta amylase, as an example lumen filler
]

filler_from_pei2016 = true
scattering_factors = "shtyrov"

# Sizes are set against the THINNEST box axis, 128 x 10 = 1280 A, not the
# 2560 A width: an organelle wider than the slab is cut open by the z walls,
# and an open shape encloses no lumen, so the `location = "lumen"` filler
# above would have nowhere to go. A closed interior is the normal outcome
# at this size rather than a guaranteed one: placement stays random and z
# clipping stays permitted. Same reasoning as configs/tomogram.toml, scaled
# to this smaller box. Omitting these ranges entirely would fall back
# to the automatic cap (_cap_membrane_auto_size_ranges in
# specter.pipelines._tomogram), which cannot help here: with every axis
# clippable it measures the widest axis, on purpose, since clipping is
# allowed.
[[membrane]]
shape_backend = "spherical_harmonics"
bilayer_thickness = 30.0
sh_axes_range = [120.0, 400.0]   # SEMI-axes, A -- at most 800 A across
n_copies = 3

[[membrane]]
shape_backend = "swept_spline"
bilayer_thickness = 30.0
swept_total_length_range = [1000.0, 1800.0] # path contour length, A
swept_tube_radius_range = [100.0, 200.0] # tube radius, A -- at most 400 A across
n_copies = 3

[[membrane_transmembrane_specs]]
pdb_source = "1C3W"  # bacteriorhodopsin
n_copies = 10        # per membrane instance; a request, not a guarantee

[membrane_settings]
membrane_region_density_threshold = 0.05
membrane_min_transmembrane_spacing = 40.0

# Filaments -- optional. Either hand-write [[filaments]] entries (FilamentSpec
# kwargs) or set `actin = true` for the built-in ACTIN_SPEC preset.
[[filaments]]
code = "1J6Z"          # F-actin monomer
step = 27.3            # axial rise per monomer, A
flex_deg = 12.0        # max per-step path curvature, degrees
twist_deg = 166.15     # helical twist per monomer, degrees
n_copies = 20
n_monomers = [20, 60]

# Microtubules. Real 13-protofilament tubes (lumen, A-lattice seam, tubulin
# dimer wall) -- NOT a [[filaments]] entry, which would give a single
# protofilament. `code` defaults to a dimer extracted from a deposited
# microtubule reconstruction, fetched and cached on first use; `length`
# defaults to the volume diagonal so a microtubule crosses the field.
[[microtubules]]
n_copies = 2
n_protofilaments = 13   # 13 is the canonical in-cell lattice
# length = 6000.0       # A; omit to span the volume diagonal
# bend_radius = 30000.0 # A; omit for a straight, thermally bent tube

# Carbon support film -- optional, at most one [[carbon_film]] table.
[[carbon_film]]
hole_radius = 6000.0          # A (0.6 micron, Quantifoil R1.2/1.3)
edge_fraction = [0.02, 0.05]  # fraction of the frame that ends up carbon
edge_side = "random"          # "left" | "right" | "top" | "bottom" | "random"

# Gold fiducial beads -- one [[beads]] table per population. `radius` takes a
# single number or a [low, high] pair drawn per bead; real colloidal gold is
# not monodisperse, so a range is the more faithful default. How irregular
# each bead's boundary is, is bead_roughness in [advanced].
[[beads]]
radius = [80.0, 120.0]        # A -- i.e. 16-24 nm diameter
n_copies = 5

[picks]
write_picks = true
annotation_version = "1.0"
write_segmentation = true

[compute]
device = "cuda"                     # cpu | cuda | cuda:0 | 0,1,2 | auto
accumulator_device = "auto"
render_workers = "auto"
render_chunk_size = 64

# --------------------------------------------------------------------------
# Advanced. Mirrors the --help panel of the same name: a commented-out line
# means the field keeps its TomogramConfig default.
# --------------------------------------------------------------------------
[advanced]

# --- Structure handling ---
# pdb_cache_dir = "~/.cache/specter/pdb"   # default; set $SPECTER_PDB_CACHE to move it,
                                           # e.g. onto scratch. Downloads only --
                                           # your own files are read where they are.
#
# Shtyrov atom typing needs the Monomer Library for its H-containing species;
# without one ~44% of a protein falls back to per-element Peng. Unset, the
# $CLIBD_MON variable applies. See docs/installation.md.
# monomer_library_path = "~/monomers"

# --- Protein packing ---
# packing_voxel_size = 2.0       # collide on a coarser grid than the render

# --- Gold fiducials ---
# How irregular each fiducial's boundary is, as an RMS fraction of its radius.
# One number, or a [low, high] pair drawn per bead so the population mixes
# near-round and misshapen particles. 0.0 gives clean spheres.
bead_roughness = [0.0, 0.2]

# --- Reproducibility ---
# seed = 11                      # uncomment for reproducible packing
