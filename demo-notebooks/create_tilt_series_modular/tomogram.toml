# Small/fast specimen so this notebook's specimen-building step finishes
# quickly -- the focus of this notebook is the per-stage imaging pipeline
# below it, not specimen complexity. Scale target_shape/v_size/n_copies up
# for production runs -- see configs/tomogram.toml for full/canonical
# defaults.

[targets]
targets = [
    { pdb_source = "7VD8", n_copies = 2 },  # apoferritin
    { pdb_source = "6QZP", n_copies = 1 },  # ribosome
    { pdb_source = "1FA2", n_copies = 1 },  # beta-amylase
]

[[membrane]]
shape_backend = "spherical_harmonics"
sh_axes_a = [70.0, 70.0, 70.0]

[specimen]
target_shape = [56, 144, 144]   # (Z, Y, X) voxels -- modest, finishes quickly
v_size = 5.0                    # Å/voxel
filler_occupancy_fraction = 0.0
seed = 11

[output]
output_dir = "./output/"
filename = "tilt_series_modular_specimen"
