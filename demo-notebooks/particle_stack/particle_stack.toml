[potential]
pdb_code = "6bdf"
assembly = true
num_pixels = 256
pixel_size = 1.0     # Å

[microscope]
energy = 300.0       # keV
dose_min = 20.0      # e⁻/Å², used as a fixed dose (this notebook doesn't randomize per particle)
cs = 2.0             # mm
alpha = 0.1          # unitless, amplitude contrast ratio

[envelopes]
bfactor = 0.0        # Å², matches the notebook's explicit 0.0 (not "disabled")

[defocus]
defocus_min = 5000.0   # Å
defocus_max = 15000.0  # Å

[translations]
shift = 2.0  # Å

[dataset]
n_particles = 20

[models]
scattering_model = "multislice"
aberration_model = "holography"
noise_model = "poisson"
ice_model = "gd"
detector_model = "none"
coincidence_radius_min = 1.8  # pixels

[ice]
ice_thickness = 0.0       # Å
num_unique_icecubes = 1   # this notebook builds a single ice cube, not the config default of 8

[compute]
device = "cuda:1"  # adjust to an available device on your machine, e.g. "cuda:0" or "cpu"
batchsize = 5
