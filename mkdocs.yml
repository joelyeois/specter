site_name: SPECTER
site_description: Scattering & Propagation of Electrons in Cryo-EM — Twin Emulator & Reconstruction
repo_url: https://github.com/joelyeois/specter
repo_name: joelyeois/specter
docs_dir: docs

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo-light.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - User Guide:
      - Generate a particle stack: user-guide/particle-stack.md
      - Generate a micrograph: user-guide/micrograph.md
      - Generate a tilt series: user-guide/tilt-series.md
      - Build a tomogram specimen: user-guide/build-tomogram.md
      - Generate a CryoSPARC dataset twin: user-guide/dataset-twin.md
      - Using the ice cache: user-guide/ice-cache.md
      - Configure a run: user-guide/configuration.md
      - Manage jobs: user-guide/jobs.md
      - Reconstruct a volume: user-guide/reconstruction.md
  - Concepts:
      - Overview: concepts/index.md
      - Pipeline overview: concepts/pipeline-overview.md
      - Specimens:
          - Overview: concepts/specimens.md
          - Atomic potentials: concepts/atomic-potentials.md
          - Ice structure: concepts/ice.md
          - Single-particle:
              - Pose & crowding: concepts/pose-crowding.md
          - Cryo-ET:
              - Overview: concepts/cryoet-specimen/index.md
              - Membrane shape:
                  - Overview: concepts/membrane-shape/index.md
                  - Spherical harmonics: concepts/membrane-shape/spherical-harmonics.md
                  - Swept spline: concepts/membrane-shape/swept-spline.md
              - Bilayer & transmembrane proteins: concepts/cryoet-specimen/bilayer.md
              - Filaments: concepts/cryoet-specimen/filaments.md
              - Gold fiducial beads: concepts/cryoet-specimen/beads.md
              - Carbon support film: concepts/cryoet-specimen/carbon-film.md
              - Regions & protein packing: concepts/cryoet-specimen/packing.md
      - Forward simulation:
          - Overview: concepts/forward-simulation.md
          - Scattering:
              - Overview: concepts/scattering/index.md
              - Multislice: concepts/scattering/multislice.md
              - Rytov: concepts/scattering/rytov.md
              - Other modes: concepts/scattering/other-modes.md
          - Aberrations: concepts/aberrations.md
          - Detector: concepts/detector.md
      - Reconstruction math: concepts/reconstruction-math.md
  - Reference:
      - Overview: api/index.md
      - specter: api/specter.md
      - specter.aberrations: api/aberrations.md
      - specter.atom: api/atom.md
      - specter.cli: api/cli.md
      - specter.ghostbuster: api/ghostbuster.md
      - specter.ice: api/ice.md
      - specter.imagegenerator: api/imagegenerator.md
      - specter.io: api/io.md
      - specter.jobs: api/jobs.md
      - specter.pipelines: api/pipelines.md
      - specter.rotations: api/rotations.md
      - specter.specimen: api/specimen.md
      - specter.tilt: api/tilt.md
      - Core modules: api/core.md

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            docstring_section_style: table
            members_order: source
