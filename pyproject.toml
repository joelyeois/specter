[project]
name = "specter"
version = "0.1.0"
description = "Scattering & Propagation of Electrons in Cryo-EM: Twin Emulator & Reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.85",
    "biotite>=1.4.0",
    "cryosparc-tools>=5.0",
    "eerfile>=0.0.4",
    "gemmi>=0.7.3",
    "h5py>=3.14.0",
    "lightning>=2.5.5",
    "matplotlib>=3.10.6",
    "mrcfile>=1.5.4",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "polnet",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "roma>=1.5.7",
    "scikit-image>=0.25.2",
    "scipy>=1.16.2",
    "starfile>=0.5.13",
    "torch>=2.5.0",
    "torchinterp1d>=1.1",
    "tqdm>=4.67.1",
    "vesin-torch>=0.6.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.0",
    "furo>=2024.1.29",
    "sphinx-autoapi>=3.0",
    "sphinx-copybutton>=0.5",
]

[dependency-groups]
dev = [
    "ase>=3.29.0",
    "cryoet-data-portal>=4.8.0",
    "gemmi>=0.7.3",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "rich>=14.2.0",
    "ruff>=0.14.4",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
polnet = { git = "https://github.com/anmartinezs/polnet.git", rev = "v1.1.2" }

[[tool.mypy.overrides]]
module = [
    "biotite.*",
    "cryosparc.*",
    "ipywidgets.*",
    "mrcfile.*",
    "pandas.*",
    "polnet.*",
    "requests.*",
    "roma.*",
    "scipy.*",
    "starfile.*",
    "torchinterp1d.*",
    "tqdm.*",
    "vesin_torch.*",
    "vtk.*",
]
ignore_missing_imports = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
specter = ["atom_data/*.txt"]

[project.scripts]
specter-jobs = "specter.jobs._cli:main"

