[project]
name = "specter"
version = "0.1.0"
description = "Scattering & Propagation of Electrons in Cryo-EM: Twin Emulator & Reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.85",
    "biotite>=1.4.0",
    "cryosparc-tools>=4.7.1",
    "eerfile>=0.0.4",
    "gemmi>=0.7.3",
    "h5py>=3.14.0",
    "lightning>=2.5.5",
    "matplotlib>=3.10.6",
    "mrcfile>=1.5.4",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "scikit-image>=0.25.2",
    "scipy>=1.16.2",
    "starfile>=0.5.13",
    "torch>=2.8.0",
    "torchinterp1d>=1.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "gemmi>=0.7.3",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "rich>=14.2.0",
    "ruff>=0.14.4",
    "seaborn>=0.13.2",
]

[tool.uv]
package = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
specter = ["atom_data/*.txt"]

[project.scripts]
specter-jobs = "specter.jobs._cli:main"

